services:
  nginx:
    build:
      context: ./srcs/requirements/nginx
      args:
        - BASE_OS=${BASE_OS}
    # Healthcheck : vérifie que nginx répond (même une redirection 301 est OK).
    # On teste le port 443 (HTTPS) avec l'option -k pour ignorer le certificat auto-signé.
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    container_name: nginx
    restart: unless-stopped
    ports:
      # Only expose port 443 (HTTPS with TLSv1.2/1.3) as the sole entry point
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./srcs/requirements/nginx/conf/default:/etc/nginx/conf.d/default.conf:ro
      - ./srcs/requirements/nginx/certs/nginx.crt:/etc/ssl/certs/nginx.crt:ro
      - ./srcs/requirements/nginx/certs/nginx.key:/etc/ssl/private/nginx.key:ro
    networks:
      - inception_net

  mariadb:
    build:
      context: ./srcs/requirements/mariadb
      args:
        - BASE_OS=${BASE_OS}
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_net
      
    # Healthcheck plus robuste : utilise `mysqladmin ping --silent` pour vérifier
    # que le processus MariaDB accepte des connexions TCP. Cette vérification ne
    # dépend pas d'un utilisateur/MySQL pré-existant, elle teste simplement la disponibilité.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  wordpress:
    build:
      context: ./srcs/requirements/wordpress
      args:
        - BASE_OS=${BASE_OS}
        - WORDPRESS_VERSION=${WORDPRESS_VERSION}
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
    # Healthcheck pour WordPress : vérifie que php-fpm répond sur le port 9000.
    # Utilise cgi-fcgi pour tester que le processus FastCGI accepte des connexions.
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # WordPress runs php-fpm only; no HTTP port exposed from this container.
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_USER=${MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE}
      - WORDPRESS_DEBUG=${WORDPRESS_DEBUG}
      - WP_ADMIN_PASSWORD_FILE=/run/secrets/wp_admin_password
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - wp_admin_password
      - mysql_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_net

volumes:
  wordpress_data:
    driver: local
  mariadb_data:
    driver: local

networks:
  inception_net:
    name: inception_net
    driver: bridge

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_password:
    file: ./secrets/mysql_password
  wp_admin_password:
    file: ./secrets/wp_admin_password

# Notes:
# - Variables are loaded from a `.env` file placed next to this compose file (example provided).
# - `restart: unless-stopped` ensures services restart after daemon reboot unless explicitly stopped.
# - Docker secrets are used to securely pass sensitive credentials to containers.
# - Only port 443 (HTTPS with TLSv1.2/1.3) is exposed as the sole entry point to the infrastructure.
